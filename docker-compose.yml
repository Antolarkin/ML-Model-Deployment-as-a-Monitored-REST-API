services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./ml/saved_model:/app/ml/saved_model
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/metrics", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
